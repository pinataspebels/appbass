<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epicenter Pro Bass & Reverb Player</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .input-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #121212;
            color: #fff;
            margin-bottom: 10px;
        }
        button {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00cc99;
        }
        .controls {
            margin: 20px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
        }
        .control-group {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
        }
        .control-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #b0b0b0;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        .control-group span {
            float: right;
            color: #00ffcc;
            font-weight: bold;
        }
        canvas {
            background: #000000;
            border-radius: 8px;
            margin-top: 15px;
            width: 100%;
            height: 150px;
        }
        #subwoofer-visual {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #333 30%, #111 70%);
            border: 4px solid #00ffcc;
            border-radius: 50%;
            margin: 20px auto;
            transition: transform 0.05s ease;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }
        #youtube-player {
            display: none;
        }
        #status-msg {
            color: #00ffcc;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Epicenter Pro PWA</h1>
        <p>Restaurador de Bajos + Reverb y Eco de Subwoofer</p>

        <div class="input-box">
            <label style="display:block; color:#00ffcc; margin-bottom:5px; font-weight:bold;">Enlace de YouTube / YouTube Music</label>
            <input type="text" id="ytUrl" placeholder="Pega el link o compártelo desde YouTube...">
            <br>
            <button id="loadVideo">Cargar y Reproducir</button>
            <div id="status-msg"></div>
        </div>

        <div id="youtube-player"></div>

        <!-- Controles de Audio Avanzados -->
        <div class="controls">
            <div class="control-group">
                <label>Frecuencia Sweep (Hz): <span id="freqVal">50</span></label>
                <input type="range" id="sweepFreq" min="30" max="80" value="50">
            </div>
            <div class="control-group">
                <label>Bass Boost (Epicenter): <span id="boostVal">0</span> dB</label>
                <input type="range" id="bassBoost" min="0" max="15" value="0" step="0.5">
            </div>
            <div class="control-group">
                <label>Filtro Subsónico (Hz): <span id="subVal">30</span></label>
                <input type="range" id="subsonic" min="20" max="45" value="30">
            </div>
            <div class="control-group">
                <label>Ancho de Banda (Q): <span id="qVal">2.0</span></label>
                <input type="range" id="qWidth" min="0.5" max="5.0" value="2.0" step="0.1">
            </div>
            <div class="control-group">
                <label>Reverb de Bajeo: <span id="reverbVal">0</span>%</label>
                <input type="range" id="bassReverb" min="0" max="100" value="0">
            </div>
            <div class="control-group">
                <label>Eco / Profundidad Sub: <span id="echoVal">0</span>%</label>
                <input type="range" id="subEcho" min="0" max="100" value="0">
            </div>
        </div>

        <div id="subwoofer-visual" title="Cono de Subwoofer"></div>

        <canvas id="visualizer"></canvas>
    </div>

    <script>
        let player;
        let audioCtx, sourceNode, bassFilter, subsonicFilter, reverbNode, delayNode, feedbackNode, dryGain, wetReverbGain, wetEchoGain, analyser;
        let isAudioInitialized = false;
        let pendingVideoId = null;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: '',
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            const params = new URLSearchParams(window.location.search);
            const sharedUrl = params.get('url') || params.get('text');
            
            if (sharedUrl) {
                const videoId = extractVideoId(sharedUrl);
                if (videoId) {
                    document.getElementById('ytUrl').value = sharedUrl;
                    document.getElementById('status-msg').textContent = "¡Enlace recibido de YouTube!";
                    pendingVideoId = videoId;
                }
            }

            document.getElementById('loadVideo').addEventListener('click', () => {
                const url = document.getElementById('ytUrl').value;
                const videoId = extractVideoId(url);
                if (videoId) {
                    player.loadVideoById(videoId);
                    initAudioContext();
                    document.getElementById('status-msg').textContent = "Reproduciendo...";
                } else {
                    alert("Enlace no válido. Asegúrate de copiar o compartir el link correcto.");
                }
            });

            if (pendingVideoId) {
                setTimeout(() => {
                    player.loadVideoById(pendingVideoId);
                    initAudioContext();
                }, 1000);
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*(?:(?:m\.)?youtube\.com|music\.youtube\.com|youtu\.be)\/(?:(?:watch\?(?:[\w]+=[\w\-]+&)*v=)|(?:embed\/|v\/|vi\/|shorts\/|attribution_link\?a=)?)([\w\-]{11})/i;
            const match = url.match(regExp);
            return (match && match[1]) ? match[1] : null;
        }

        function initAudioContext() {
            if (isAudioInitialized) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return;
            }

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const ytIframe = document.querySelector('#youtube-player iframe');
                sourceNode = audioCtx.createMediaElementSource(ytIframe);

                // 1. Filtro Subsónico
                subsonicFilter = audioCtx.createBiquadFilter();
                subsonicFilter.type = 'highpass';
                subsonicFilter.frequency.value = parseFloat(document.getElementById('subsonic').value);

                // 2. Filtro de Realce de Bajos (Epicenter / Sweep)
                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = 'peaking';
                bassFilter.frequency.value = parseFloat(document.getElementById('sweepFreq').value);
                bassFilter.Q.value = parseFloat(document.getElementById('qWidth').value);
                bassFilter.gain.value = parseFloat(document.getElementById('bassBoost').value);

                // 3. Nodo de Reverberación simulada para bajos (Convolución/Filtro espacial)
                reverbNode = audioCtx.createConvolver();
                createBassReverbImpulse();

                // 4. Nodos de Eco / Profundidad para Subwoofer (Delay + Feedback)
                delayNode = audioCtx.createDelay(1.0);
                delayNode.delayTime.value = 0.15; // 150ms de retardo rítmico para el eco de graves
                feedbackNode = audioCtx.createGain();
                feedbackNode.gain.value = 0.3;

                // Controles de mezcla (Wet/Dry) para los efectos
                wetReverbGain = audioCtx.createGain();
                wetReverbGain.gain.value = parseFloat(document.getElementById('bassReverb').value) / 100;

                wetEchoGain = audioCtx.createGain();
                wetEchoGain.gain.value = parseFloat(document.getElementById('subEcho').value) / 100;

                // Analizador de espectro
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;

                // Enrutamiento de la cadena de audio principal
                sourceNode.connect(subsonicFilter);
                subsonicFilter.connect(bassFilter);

                // Bifurcación hacia los efectos de bajos
                bassFilter.connect(analyser); // Audio limpio con Epicenter

                // Camino de Reverberación de Bajos
                bassFilter.connect(reverbNode);
                reverbNode.connect(wetReverbGain);
                wetReverbGain.connect(analyser);

                // Camino de Eco / Profundidad de Subwoofer
                bassFilter.connect(delayNode);
                delayNode.connect(feedbackNode);
                feedbackNode.connect(delayNode); // Bucle de eco
                delayNode.connect(wetEchoGain);
                wetEchoGain.connect(analyser);

                // Salida final a las bocinas del teléfono
                analyser.connect(audioCtx.destination);

                isAudioInitialized = true;
                visualize();
            } catch(e) {
                console.log("Error al iniciar el contexto de audio", e);
            }
        }

        // Generador matemático de impulso espacial exclusivo para frecuencias bajas (Reverb de bajeo)
        function createBassReverbImpulse() {
            const rate = audioCtx.sampleRate;
            const length = rate * 0.8; // 800ms de cola de reverberación
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);

            for (let i = 0; i < length; i++) {
                const decay = Math.exp(-i / (rate * 0.2)); // Decaimiento suave
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }
            reverbNode.buffer = impulse;
        }

        // Listeners para controles en tiempo real
        document.getElementById('sweepFreq').addEventListener('input', (e) => {
            document.getElementById('freqVal').textContent = e.target.value;
            if (bassFilter) bassFilter.frequency.value = parseFloat(e.target.value);
        });

        document.getElementById('bassBoost').addEventListener('input', (e) => {
            document.getElementById('boostVal').textContent = e.target.value;
            if (bassFilter) bassFilter.gain.value = parseFloat(e.target.value);
        });

        document.getElementById('subsonic').addEventListener('input', (e) => {
            document.getElementById('subVal').textContent = e.target.value;
            if (subsonicFilter) subsonicFilter.frequency.value = parseFloat(e.target.value);
        });

        document.getElementById('qWidth').addEventListener('input', (e) => {
            document.getElementById('qVal').textContent = e.target.value;
            if (bassFilter) bassFilter.Q.value = parseFloat(e.target.value);
        });

        document.getElementById('bassReverb').addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('reverbVal').textContent = val;
            if (wetReverbGain) wetReverbGain.gain.value = val / 100;
        });

        document.getElementById('subEcho').addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('echoVal').textContent = val;
            if (wetEchoGain) wetEchoGain.gain.value = val / 100;
        });

        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const subwooferVisual = document.getElementById('subwoofer-visual');
        const dataArray = new Uint8Array(128);

        function visualize() {
            requestAnimationFrame(visualize);

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            analyser.getByteFrequencyData(dataArray);

            let bassSum = 0;
            for (let i = 0; i < 10; i++) {
                bassSum += dataArray[i];
            }
            let bassAverage = bassSum / 10;
            let scale = 1 + (bassAverage / 255) * 0.4;
            subwooferVisual.style.transform = `scale(${scale})`;

            canvasCtx.fillStyle = '#000000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / 64) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < 64; i++) {
                barHeight = dataArray[i] / 1.5;
                canvasCtx.fillStyle = `rgb(${barHeight + 100}, 255, 204)`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }
    </script>

</body>
</html>
